<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurateur de Barre CSO</title>
    <meta name="description" content="Configurez votre barre de CSO EQUINOX : choisissez les couleurs RAL de chaque zone du modèle, la longueur et la quantité, puis ajoutez-la au panier.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #2c3e50;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 24px 60px;
            border-bottom: 4px solid #e74c3c;
        }

        h1 {
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: #ecf0f1;
            font-size: 0.9em;
            line-height: 1.5;
            max-width: 800px;
        }

        .btn-retour {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 20px;
            font-size: 0.8em;
            background-color: #95a5a6;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-retour:hover {
            background-color: #7f8c8d;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px 40px 40px;
        }

        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 300;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e74c3c;
        }

        .controls {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.8em;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .control-group select,
        .control-group input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #bdc3c7;
            font-size: 1em;
            background: white;
            min-height: 40px;
        }

        .control-group input[type="number"] {
            width: 80px;
            text-align: center;
        }

        #svgContainer {
            background: white;
            padding: 20px;
            border: 1px solid #e0e0e0;
            margin: 10px 0 0;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #svgContainer svg {
            width: 100%;
            max-width: 760px;
            height: auto;
            display: block;
            touch-action: manipulation;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px 6px;
            padding: 8px;
            border: 1px solid #ececec;
            background: #fafafa;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .color-swatch {
            width: 44px;
            height: 44px;
            border: 2px solid #bdc3c7;
            transition: all 0.15s;
        }

        .color-item:hover .color-swatch {
            transform: translateY(-1px);
        }

        .color-swatch.selected {
            border: 3px solid #e74c3c;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #e74c3c;
        }

        .color-label {
            font-size: 0.7em;
            color: #7f8c8d;
            text-align: center;
            font-weight: 500;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 0.85em;
            font-family: inherit;
            color: white;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            font-weight: 400;
            display: inline-block;
        }

        .btn-primary {
            background: #27ae60;
        }

        .btn-primary:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #95a5a6;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            header {
                padding: 18px 16px 20px;
            }
            h1 {
                font-size: 1.6em;
            }
            .container {
                padding: 20px 16px 28px;
            }
            #svgContainer {
                padding: 12px 4px;
                min-height: 0;
            }
            .button-container {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="btn-retour">← Retour à l'accueil</a>
        <h1>Configurateur de Barre CSO</h1>
        <p>
            Choisissez une couleur dans la palette, puis cliquez sur les zones de la barre pour les colorer.
        </p>
    </header>

    <div class="container">
        <div class="section">
            <h2 class="section-title">Configuration de la barre</h2>

            <div class="controls">
                <div class="control-group">
                    <label for="length">Longueur</label>
                    <select id="length">
                        <option value="3m">3m</option>
                        <option value="3.5m">3,50m</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="quantity">Quantité</label>
                    <input type="number" id="quantity" min="1" value="1">
                </div>
            </div>

            <div id="svgContainer"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Palette de couleurs RAL</h2>
            <div class="color-palette" id="colorPalette"></div>
        </div>

        <div class="button-container">
            <button class="btn btn-primary" id="addToCartBtn" onclick="addToCart()">Ajouter au Panier</button>
            <a href="panier.html" class="btn btn-secondary">Voir le Panier</a>
            <button class="btn btn-danger" onclick="if (clearCart()) alert('Le panier a été vidé.')">Vider le Panier</button>
        </div>
    </div>

    <script src="js/ral.js"></script>
    <script src="js/cart.js"></script>
    <script>
        let selectedColor = ralColors[0];
        const colorPalette = document.getElementById("colorPalette");

        // Pour chaque couleur, on crée un conteneur cliquable qui regroupe la pastille et le nom RAL
        ralColors.forEach(color => {
            const swatchContainer = document.createElement("div");
            swatchContainer.classList.add("color-item");

            // Création de la pastille de couleur
            const swatch = document.createElement("div");
            swatch.classList.add("color-swatch");
            swatch.style.backgroundColor = color;
            swatchContainer.appendChild(swatch);

            // Création du label pour afficher le code RAL correspondant
            const label = document.createElement("div");
            label.classList.add("color-label");
            label.innerText = getRal(color) || "RAL inconnu";
            swatchContainer.appendChild(label);

            swatchContainer.addEventListener("click", () => {
                // Retirer la classe "selected" à toutes les pastilles
                document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
                swatch.classList.add("selected");
                selectedColor = color;
            });

            colorPalette.appendChild(swatchContainer);
        });

        // La première couleur est la couleur active au chargement : on l'affiche comme sélectionnée.
        colorPalette.querySelector(".color-swatch").classList.add("selected");

        const groups = {
            "b1-group1": ["b1-s1"],

            "b2-group1": ["b2-s1"], // Bleu foncé
            "b2-group2": ["b2-s2"], // Orange

            "b3-group1": ["b3-s1", "b3-s3", "b3-s5", "b3-s7"], // Bleu foncé
            "b3-group2": ["b3-s2", "b3-s4", "b3-s6"], // Orange

            "b4-group1": ["b4-s1", "b4-s3"], // Bleu foncé
            "b4-group2": ["b4-s2"], // Orange

            "b5-group1": ["b5-s1", "b5-s3", "b5-s5"], // Bleu foncé
            "b5-group2": ["b5-s2", "b5-s4"], // Orange

            "b6-group1": ["b6-s3", "b6-s6", "b6-s9"], // Bleu
            "b6-group2": ["b6-s2", "b6-s4", "b6-s8", "b6-s10"], // Orange
            "b6-group3": ["b6-s1", "b6-s5", "b6-s7", "b6-s11"], // Blanc central

            "b7-group1": ["b7-s2", "b7-s4", "b7-s6", "b7-s8", "b7-s10", "b7-s12", "b7-s14", "b7-s16"], // Bleu foncé
            "b7-group2": ["b7-s1", "b7-s3", "b7-s5", "b7-s7", "b7-s11", "b7-s13", "b7-s15", "b7-s17"], // Orange
            "b7-group3": ["b7-s9"], // Blanc

            "b8-group1": ["b8-s2", "b8-s4"], // Bleu foncé
            "b8-group2": ["b8-s1", "b8-s3", "b8-s5"], // Orange

            "b9-group1": ["b9-s2", "b9-s4", "b9-s6", "b9-s8", "b9-s10", "b9-s12"], // Bleu foncé
            "b9-group2": ["b9-s3", "b9-s5", "b9-s7", "b9-s9", "b9-s11", "b9-s1", "b9-s13"], // Orange
            // Blanc

            "b10-group1": ["b10-s2", "b10-s4"], // Bleu foncé
            "b10-group2": ["b10-s1", "b10-s5"], // Orange
            "b10-group3": ["b10-s3"], // Blanc

            "b11-group1": ["b11-s2"], // Bleu foncé
            "b11-group2": ["b11-s1", "b11-s3"], // Orange

            "b12-group1": ["b12-s1", "b12-s3", "b12-s5", "b12-s7", "b12-s9", "b12-s11", "b12-s13"], // Bleu foncé
            "b12-group2": ["b12-s2", "b12-s6", "b12-s8", "b12-s12"], // Orange
            "b12-group3": ["b12-s4", "b12-s10"], // Blanc
            "b12-group4": ["b12-s14"],

            "b13-group1": ["b13-s1"],

            "b14-group1": ["b14-s1", "b14-s1-0", "b14-s1-9", "b14-s1-8"],
            "b14-group2": ["b14-s2", "b14-s2-1", "b14-s2-4", "b14-s2-7"],


        };

        function findGroup(sectionId) {
            for (const [group, sections] of Object.entries(groups)) {
                if (sections.includes(sectionId)) {
                    return group;
                }
            }
            return null;
        }

        // Applique la couleur sélectionnée à toutes les sections du groupe de la section `sectionId`.
        function colorGroupOf(sectionId) {
            console.log("Section cliquée:", sectionId);
            const groupId = findGroup(sectionId);
            if (!groupId) {
                console.warn("Aucun groupe trouvé pour :", sectionId);
                return;
            }
            groups[groupId].forEach(id => {
                const targetSection = document.getElementById(id);
                if (targetSection) {
                    const elements = targetSection.querySelectorAll("path, rect, circle, polygon, line, ellipse");
                    if (elements.length === 0) {
                        targetSection.setAttribute("fill", selectedColor);
                        targetSection.style.fill = selectedColor;
                    } else {
                        elements.forEach(element => {
                            element.setAttribute("fill", selectedColor);
                            element.style.fill = selectedColor;
                        });
                    }
                }
            });
        }

        // Vrai si le clic vient d'un doigt ou d'un stylet plutôt que d'une souris.
        function isFingerTap(event) {
            if (event.pointerType) return event.pointerType !== "mouse";
            return window.matchMedia("(pointer: coarse)").matches;
        }

        // Sur téléphone, les zones les plus étroites ne font que quelques pixels de large : trop peu
        // pour un doigt. Chaque pièce reçoit donc une surface tactile d'au moins 28 px de large,
        // prolongée de 8 px au-dessus et au-dessous, et parmi les pièces dont la surface contient le
        // point touché, on retient celle dont le centre est le plus proche. Une zone étroite se
        // touche ainsi en visant à peu près, sans gêner les zones larges qui l'entourent.
        function sectionAtFinger(sections, x, y) {
            const MIN_WIDTH = 28;
            const PAD_Y = 8;
            let best = null;
            let bestDistance = Infinity;

            sections.forEach(section => {
                const shapes = section.querySelectorAll("path, rect, circle, polygon, line, ellipse");
                Array.from(shapes.length ? shapes : [section]).forEach(shape => {
                    const rect = shape.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const padX = Math.max(0, (MIN_WIDTH - rect.width) / 2);
                    if (x < rect.left - padX || x > rect.right + padX) return;
                    if (y < rect.top - PAD_Y || y > rect.bottom + PAD_Y) return;

                    const distance = Math.abs(x - (rect.left + rect.right) / 2);
                    if (distance < bestDistance) {
                        best = section;
                        bestDistance = distance;
                    }
                });
            });
            return best;
        }

        // Convertit une couleur calculée ("rgb(0, 128, 128)") en code hex.
        // Renvoie null pour tout le reste (dégradé, "none"…).
        function rgbToHex(color) {
            const match = /^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(color);
            if (!match) return null;
            return "#" + match.slice(1).map(n => Number(n).toString(16).padStart(2, "0")).join("");
        }

        // Vrai si une zone colorable affiche encore une couleur hors palette,
        // c'est-à-dire la couleur par défaut du SVG (#008080, #ff9955…).
        function hasOffPaletteZone() {
            const shapes = "path, rect, circle, polygon, line, ellipse";
            return Object.values(groups).flat().some(sectionId => {
                const section = document.getElementById(sectionId);
                if (!section) return false;
                const elements = section.querySelectorAll(shapes);
                return Array.from(elements.length ? elements : [section])
                    .some(element => !getRal(rgbToHex(getComputedStyle(element).fill)));
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const model = urlParams.get("model");

        // Mode modification : config.html?model=1xx&edit=<index de la ligne du panier>
        const editContext = model ? getEditContext("config.html", model) : null;

        // Recopie, section par section, les couleurs du SVG enregistré dans l'article.
        function restoreSectionColors(savedSvg) {
            const shapes = "path, rect, circle, polygon, line, ellipse";
            const savedDoc = new DOMParser().parseFromString(savedSvg || "", "text/html");
            const copyFill = (from, to) => {
                const fill = from.getAttribute("fill");
                if (fill !== null) to.setAttribute("fill", fill);
                if (from.style.fill) to.style.fill = from.style.fill;
            };

            document.querySelectorAll("#svgContainer [id^='b'][id*='-s']").forEach(section => {
                const savedSection = savedDoc.getElementById(section.id);
                if (!savedSection) return;
                copyFill(savedSection, section);

                const elements = section.querySelectorAll(shapes);
                const savedElements = savedSection.querySelectorAll(shapes);
                if (elements.length !== savedElements.length) return;
                elements.forEach((element, i) => copyFill(savedElements[i], element));
            });
        }

        // Remet le configurateur dans l'état de l'article en cours de modification.
        function restoreItem(item) {
            document.getElementById("quantity").value = item.quantity || 1;
            setSelectValue("length", item.length);
            restoreSectionColors(item.svg);
            document.getElementById("addToCartBtn").textContent = "Mettre à jour l'article";
        }

        if (model) {
            fetch(`Bar_V${model}.svg`)
                .then(response => response.text())
                .then(svgData => {
                    const svgContainer = document.getElementById("svgContainer");
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgData, "image/svg+xml");
                    const svgElement = svgDoc.documentElement;
                    svgContainer.appendChild(svgElement);

                    const sections = svgContainer.querySelectorAll("[id^='b'][id*='-s']");
                    sections.forEach(section => {
                        section.style.cursor = "pointer";
                        section.addEventListener("click", function() {
                            colorGroupOf(this.id);
                        });
                    });

                    // Au doigt, c'est la zone la plus proche du point touché qui est colorée (voir sectionAtFinger).
                    svgElement.addEventListener("click", event => {
                        if (!isFingerTap(event)) return;
                        const section = sectionAtFinger(sections, event.clientX, event.clientY);
                        if (!section) return;
                        event.stopPropagation();
                        colorGroupOf(section.id);
                    }, true);

                    if (editContext) restoreItem(editContext.item);
                })
                .catch(error => alert("Erreur de chargement du modèle SVG"));
        } else {
            alert("Modèle non spécifié !");
        }


        function addToCart() {
            const model = new URLSearchParams(window.location.search).get("model");
            const quantity = parseInt(document.getElementById("quantity").value);
            const length = document.getElementById("length").value;

            console.log("🛒 Tentative d'ajout au panier...");
            console.log("Modèle sélectionné:", model);
            console.log("Quantité:", quantity);
            console.log("Modèle récupéré:", model);


            if (!model) {
                alert("Aucun modèle sélectionné.");
                console.error("❌ Erreur : Aucun modèle détecté.");
                return;
            }

            if (quantity <= 0) {
                alert("Veuillez entrer une quantité valide.");
                console.error("❌ Erreur : Quantité invalide.");
                return;
            }

            // Les couleurs par défaut du SVG ne sont pas des RAL : elles resteraient sur l'image
            // du devis sans figurer dans la liste des couleurs.
            if (hasOffPaletteZone()) {
                alert("Certaines zones de la barre ont encore leur couleur d'origine, qui ne fait pas partie de la palette RAL.\n\n" +
                    "Cliquez sur chacune de ces zones pour lui appliquer une couleur de la palette, puis " +
                    (editContext ? "mettez à jour l'article." : "ajoutez la barre au panier."));
                return;
            }

            // Récupérer toutes les couleurs appliquées sur les éléments SVG
            let selectedSections = document.querySelectorAll("#svgContainer svg [fill]");
            let colors = [...new Set(Array.from(selectedSections).map(el => el.getAttribute("fill")).filter(c => c !== "none"))];

            console.log("Couleurs sélectionnées:", colors);

            if (colors.length === 0) {
                alert("Veuillez sélectionner au moins une couleur.");
                console.error("❌ Erreur : Aucune couleur sélectionnée.");
                return;
            }

            // Capturer l'état actuel du SVG sous forme de chaîne HTML
            const svgElement = document.getElementById("svgContainer").innerHTML;

            console.log("🔄 SVG sauvegardé:", svgElement);

            if (!svgElement || svgElement.trim() === "") {
                alert("Erreur : Impossible de récupérer l'image du modèle.");
                console.error("❌ Erreur : SVG non récupéré.");
                return;
            }

            // Ajouter l'article (ou remplacer la ligne en cours de modification), avec le SVG enregistré
            const result = saveCartItem({
                model: model,
                colors: colors,
                quantity: quantity,
                svg: svgElement,
                length: length,
                sourcePage: "config.html"
            }, editContext);

            if (result === "updated") {
                window.location.href = "panier.html";
            } else if (result === "added") {
                console.log("✅ Modèle ajouté au panier avec succès !");
                alert("Modèle ajouté au panier !");
            }
        }
    </script>

</body>

</html>
